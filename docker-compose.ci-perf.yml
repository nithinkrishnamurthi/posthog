# CI performance overlay — disable durability guarantees for test databases.
# Safe for tests (ephemeral data, no crash recovery needed).
services:
    db:
        command: >
            postgres
            -c fsync=off
            -c synchronous_commit=off
            -c full_page_writes=off
            -c random_page_cost=1.0
            -c effective_cache_size=1GB
            -c shared_buffers=256MB
            -c work_mem=64MB
